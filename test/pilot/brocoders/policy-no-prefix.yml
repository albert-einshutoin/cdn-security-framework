# Evaluation only; not upstream or production Edge Policy.
version: 2
project: brocoders-uri-pilot-no-prefix
defaults:
  mode: enforce
request:
  allow_methods: [GET, POST, PUT, PATCH, DELETE]
  block:
    header_missing: []
routes:
  - name: evaluated-versioned-routes
    match:
      path_prefixes: ["/v1"]
response_headers: {}

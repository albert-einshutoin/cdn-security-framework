name: Release to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish or verify, for example v1.1.0'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    env:
      # CI-only build tokens — match the names used by policy-lint.yml so
      # drift and unit tests that consume them reproduce here identically.
      EDGE_ADMIN_TOKEN: ci-build-token-not-for-deploy
      ORIGIN_SECRET: ci-origin-secret-not-for-deploy
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release_tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG_NAME="${DISPATCH_TAG}"
          fi
          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a v-prefixed version."
            exit 1
          fi
          printf 'tag=%s\n' "${TAG_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Checkout release tag for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git checkout --detach "refs/tags/${RELEASE_TAG}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Ensure tag matches package version
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          TAG_NAME="${RELEASE_TAG}"
          git fetch origin main
          TAG_COMMIT="$(git rev-list -n 1 "$TAG_NAME")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Release tag $TAG_NAME is not reachable from origin/main."
            exit 1
          fi
          TAG_VERSION="${TAG_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Quality gate (single source)
        run: npm run test:ci

      - name: Resolve owner approval and protected release environment
        id: release_plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CSF_RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: node scripts/release-binding.js plan

      - name: Download the approved main single-pack artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-candidate-${{ steps.release_plan.outputs.run }}-${{ steps.release_plan.outputs.attempt }}
          run-id: ${{ steps.release_plan.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/csf-release-candidate

      - name: Download the reviewed RC single-pack artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-candidate-${{ steps.release_plan.outputs.rc_run }}-${{ steps.release_plan.outputs.rc_attempt }}
          run-id: ${{ steps.release_plan.outputs.rc_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/csf-reviewed-rc

      - name: Verify approval, final main checks, tag and exact tarball
        id: release_binding
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CSF_RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          CSF_RELEASE_ARTIFACT_DIR: ${{ runner.temp }}/csf-release-candidate
          CSF_RC_ARTIFACT_DIR: ${{ runner.temp }}/csf-reviewed-rc
        run: node scripts/release-binding.js verify

      - name: Check whether npm version already exists
        id: npm_version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} already exists on npm; skipping publish and running verification only."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package to npm (with SLSA v1 provenance attestation)
        if: steps.npm_version.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CSF_DIST_TAG: ${{ steps.release_binding.outputs.dist_tag }}
        # Always publish with --provenance so consumers can verify the tarball
        # was built by this workflow. npm transparently uses GitHub's OIDC
        # identity for the attestation; the legacy token only authorizes the
        # publish itself. Both modes produce a verifiable attestation on the
        # npm registry.
        run: npm publish "$RUNNER_TEMP/csf-release-candidate/candidate.tgz" --ignore-scripts --provenance --access public --tag "$CSF_DIST_TAG"

      # After publish, fetch the tarball we just pushed and verify the
      # registry-side attestation signatures cover it. This catches two
      # classes of failure a plain `--provenance` flag cannot: (a) the
      # attestation was never recorded on the registry, (b) the tarball on
      # the registry drifted from the workflow-built artifact (tampering in
      # transit / registry mirror misconfiguration).
      - name: Verify provenance attestation is recorded and valid
        env:
          CSF_APPROVED_SHA256: ${{ steps.release_binding.outputs.sha256 }}
        run: |
          set -e
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          echo "Verifying provenance for ${NAME}@${VERSION}..."
          # Use a scratch dir so the downloaded tarball doesn't collide with
          # the `npm pack --dry-run` artifact from the lint step.
          mkdir -p provenance-verify
          cd provenance-verify
          REGISTRY_TGZ="$(npm pack "${NAME}@${VERSION}")"
          test -f "$REGISTRY_TGZ"
          test "$(sha256sum "$REGISTRY_TGZ" | cut -d ' ' -f 1)" = "$CSF_APPROVED_SHA256"
          # `npm audit signatures` hits the registry attestation API and
          # fails non-zero when any published version in the working tree's
          # dependency set lacks a valid attestation. We run it inside the
          # scratch dir where the published tarball is the install target.
          npm init -y >/dev/null
          npm install --no-save "${NAME}@${VERSION}"
          npm audit signatures
